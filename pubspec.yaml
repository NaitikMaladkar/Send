name: send
description: "Send — Anonymous, end-to-end encrypted chat."
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # Supabase (replaces Firebase entirely)
  supabase_flutter: ^2.8.0

  # E2EE primitives (X25519 + AES-256-GCM + HKDF + PBKDF2)
  cryptography: ^2.7.0

  # Local secure storage for private keys + auth tokens
  flutter_secure_storage: ^9.2.2

  # Foreground service for push-notification delivery over Supabase Realtime websocket
  flutter_foreground_task: ^8.10.0
  flutter_local_notifications: ^17.2.3

  # File / image / PDF picking
  file_picker: ^8.1.4
  image_picker: ^1.1.2

  # State + UI helpers
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.11.1
  collection: ^1.18.0
  typed_data: ^1.4.0
  http: ^1.2.2

  # v1.0 additions
  qr_flutter: ^4.1.0                # generate QR codes for friend-add
  mobile_scanner: ^5.2.3            # scan QR codes (camera)
  record: ^5.2.1                    # voice message recording (up to 25 min)
  audioplayers: ^6.1.0              # playback voice messages
  photo_view: ^0.15.0               # in-app image viewer (pinch/zoom)
  shared_preferences: ^2.3.2        # theme preference (non-sensitive)
  path: ^1.9.0                      # path manipulation for voice temp files

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # record 5.x ships an incompatible record_linux 0.7.2 stub that fails
  # to compile (missing startStream impl). Override to a newer version.
  record_linux: ^1.0.0
  record_windows: ^1.0.0
  record_darwin: ^1.2.0
  record_web: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 26
