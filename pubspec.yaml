name: send
description: "Send — Anonymous, end-to-end encrypted chat."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # Supabase (replaces Firebase entirely)
  supabase_flutter: ^2.8.0

  # E2EE primitives (X25519 + AES-256-GCM + HKDF + PBKDF2)
  # cryptography_flutter plugin removed: pure-Dart cryptography is sufficient
  # and avoids the meta-annotation incompatibility in cryptography_flutter 2.3.4
  # on Dart 3.6.
  cryptography: ^2.7.0

  # Local secure storage for private keys + auth tokens
  flutter_secure_storage: ^9.2.2

  # Foreground service for push-notification delivery over Supabase Realtime websocket
  flutter_foreground_task: ^8.10.0
  flutter_local_notifications: ^17.2.3

  # File / image / PDF picking
  file_picker: ^8.1.4
  image_picker: ^1.1.2

  # State + UI helpers
  provider: ^6.1.2
  uuid: ^4.5.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.2
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.11.1
  collection: ^1.18.0
  typed_data: ^1.4.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 26
